name: Vellakshya GitHub Actions CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Code Hygiene (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting & Typecheck Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy on app/ai Package
        run: |
          if [ -d "app/ai" ]; then
            mypy app/ai
          else
            echo "app/ai not created yet; skipping."
          fi

  test-python:
    name: Backend Unit, API, Security & RAG Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vellakshya
          POSTGRES_PASSWORD: vellakshya_secret
          POSTGRES_DB: vellakshya_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Layered Suite
        env:
          DATABASE_URL: postgresql://vellakshya:vellakshya_secret@localhost:5432/vellakshya_db
        run: |
          PYTHONPATH=. pytest tests/ -v

  test-node-and-playwright:
    name: Frontend Vitest, Playwright E2E & axe-core a11y
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python 3.12 for Backend Server
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm run test:unit

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Start Background FastAPI Server
        run: |
          PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Run Playwright E2E, API & a11y Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 14
