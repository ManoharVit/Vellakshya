name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - feat-ux-design-system-patterns
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'deploy/**'
      - 'README.md'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: vellakshya-gcp
  GCP_REGION: us-central1

jobs:
  deploy-cloud-run:
    name: Build & Deploy Container to Cloud Run (vellakshya-gcp)
    runs-on: ubuntu-latest
    if: github.repository == 'ManoharVit/Vellakshya'
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate GCP Deployment Secret
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::Secret GCP_SA_KEY is missing or empty in repository secrets!"
            echo "To enable deployment to Cloud Run and Firebase Hosting:"
            echo "1. Create a service account key in GCP project 'vellakshya-gcp' with roles: Cloud Run Admin, Service Account User, Cloud Build Editor, Artifact Registry Writer, and Firebase Hosting Admin."
            echo "2. Add the JSON key as a repository secret: https://github.com/ManoharVit/Vellakshya/settings/secrets/actions -> GCP_SA_KEY."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: vellakshya-gcp

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: vellakshya-gcp

      - name: Deploy API Service to Cloud Run
        run: |
          gcloud run deploy vellakshya \
            --project vellakshya-gcp \
            --source . \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --set-env-vars ENVIRONMENT=production,GCP_PROJECT_ID=vellakshya-gcp,VERSION=2.0.0

      - name: Deploy to Firebase Hosting (Google CDN)
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project vellakshya-gcp --non-interactive

      - name: Deploy Isolated Worker Pool (Cloud Run Worker Pools GA)
        run: |
          if [ -f "deploy/cloudrun-worker-pool.yaml" ]; then
            gcloud beta run worker-pools replace deploy/cloudrun-worker-pool.yaml --project vellakshya-gcp --region us-central1 || true
          fi

      - name: Deploy OCR GPU Job (Cloud Run GPU GA)
        run: |
          if [ -f "deploy/cloudrun-ocr-gpu-job.yaml" ]; then
            gcloud beta run jobs replace deploy/cloudrun-ocr-gpu-job.yaml --project vellakshya-gcp --region us-central1 || true
          fi
