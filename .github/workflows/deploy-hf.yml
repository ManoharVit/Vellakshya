name: Continuous Deployment to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "Pushing main branch to Hugging Face Space (ManoharHugs/vellakshya)..."
            git push --force https://ManoharHugs:$HF_TOKEN@huggingface.co/spaces/ManoharHugs/vellakshya main
            echo "Deployment to Hugging Face Spaces completed successfully."
          else
            echo "HF_TOKEN secret not set in GitHub repository secrets. To enable automated sync, create an Access Token at https://huggingface.co/settings/tokens and add it to GitHub Settings -> Secrets as HF_TOKEN."
          fi
