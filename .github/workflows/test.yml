name: Vellakshya QA & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Backend Unit, API & PDF Services (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest Layered Suite (54 Tests)
        run: |
          PYTHONPATH=. pytest tests/ -v

  test-node-and-playwright:
    name: Frontend Vitest, Playwright E2E & axe-core a11y
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python 3.12 for Backend API
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt uvicorn

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Run Vitest Unit Tests
        run: npx vitest run

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Start Background FastAPI Server
        run: |
          PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Run Playwright E2E, API & a11y Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  load-test-k6:
    name: Performance & Load Benchmark (k6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Backend Dependencies
        run: |
          pip install -r requirements.txt uvicorn

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start FastAPI Server
        run: |
          PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Execute k6 Load Test
        run: k6 run k6/load-test.js
