<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) - Vellakshya PDF Workstation</title>
    <meta name="description" content="The requested page could not be found. Return to Vellakshya Professional PDF Workstation to edit, convert, and analyze documents.">
    <link rel="stylesheet" href="/css/styles.css?v=2.0.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png">
    <style>
        .error-page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: var(--bg);
            color: var(--text-primary);
            text-align: center;
            font-family: var(--font-body);
        }
        .error-card {
            background-color: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 48px 36px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border-radius: 9999px;
            background-color: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .error-title {
            font-family: var(--font-title);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .error-description {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-return-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 8px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        .btn-return-home:hover {
            background-color: #4338ca;
        }
        .btn-secondary-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: transparent;
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        .btn-secondary-link:hover {
            background-color: var(--border-subtle);
        }
    </style>
</head>
<body>
    <main class="error-page-container">
        <div class="error-card">
            <div class="error-badge">404 Error • Page Not Found</div>
            <h1 class="error-title">Document or Page Missing</h1>
            <p class="error-description">
                The resource, tool, or document URL you requested does not exist or has been moved. Return to the main workstation to continue your workflow.
            </p>
            <div class="error-actions">
                <a href="/" class="btn-return-home" id="btnReturnHome">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Return to Workstation</span>
                </a>
                <a href="/privacy.html" class="btn-secondary-link">
                    <span>Privacy Policy</span>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
