version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://vellakshya:vellakshya_secret@db:5432/vellakshya_db
      - VALKEY_URL=redis://valkey:6379/0
      - REDIS_URL=redis://valkey:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./app:/app/app:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=vellakshya
      - POSTGRES_PASSWORD=vellakshya_secret
      - POSTGRES_DB=vellakshya_db
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vellakshya -d vellakshya_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    container_name: vellakshya-valkey
    profiles:
      - optional
      - with-redis
      - with-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgvector_data:
  valkey_data:
