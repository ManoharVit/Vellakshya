# Netlify Edge CDN & Dynamic Reverse Proxy Configuration
# Provides continuous deployment from GitHub to https://vellakshya.netlify.app

[build]
  command = "node netlify-build.js"
  publish = "app/static"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/api/*"
  to = "https://vellakshya.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
