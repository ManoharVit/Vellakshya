# Netlify Edge CDN & Dynamic Reverse Proxy Configuration
# Provides continuous deployment from GitHub to https://vellakshya.netlify.app

[build]
  command = "node netlify-build.js"
  publish = "app/static"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self';"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
