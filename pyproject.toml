[build-system]
requires = ["setuptools>=70.0.0,<76.0.0", "wheel>=0.43.0,<0.46.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vellakshya"
version = "2.0.0"
description = "Enterprise Document Workstation & PDF Intelligence System"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Giri Manohar Vemula" }
]

[project.urls]
Homepage = "https://vellakshya.netlify.app/"
Repository = "https://github.com/ManoharVit/Vellakshya"
Documentation = "https://github.com/ManoharVit/Vellakshya#readme"

dependencies = [
    "fastapi>=0.140.0,<0.141.0",
    "starlette>=0.46.0,<2.0.0",
    "uvicorn>=0.49.0,<0.50.0",
    "python-multipart>=0.0.30,<0.1.0",
    "pymupdf>=1.28.0,<1.29.0",
    "jinja2>=3.1.4,<3.2.0",
    "pydantic>=2.14.0,<2.15.0",
    "httpx>=0.28.0,<0.29.0",
    "redis>=5.3.0,<6.0.0",
    "fakeredis>=2.20.0,<3.0.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pgvector>=0.3.0,<0.4.0",
    "pdf2docx>=0.5.13,<0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741", "W291", "F841", "E402"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "app.ai.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "fitz",
    "pymupdf",
    "fakeredis",
    "psycopg2.*",
    "pgvector.*",
]
ignore_missing_imports = true
