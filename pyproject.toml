[build-system]
requires = ["setuptools>=70.0.0,<76.0.0", "wheel>=0.43.0,<0.46.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-workbench"
version = "1.0.0"
description = "Comprehensive PDF workstation with Adobe Acrobat Pro capabilities and PDF-to-HTML conversion"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Giri Manohar Vemula" }
]
dependencies = [
    "fastapi>=0.119.0,<0.120.0",
    "starlette>=0.49.0,<0.50.0",
    "uvicorn>=0.32.0,<0.33.0",
    "python-multipart>=0.0.30,<0.1.0",
    "pymupdf>=1.25.0,<1.26.0",
    "jinja2>=3.1.4,<3.2.0",
    "pydantic>=2.14.0,<2.15.0",
    "httpx>=0.28.0,<0.29.0",
    "pytest>=8.3.0,<8.4.0",
    "pip-audit>=2.8.0,<2.9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
